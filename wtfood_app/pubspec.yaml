name: wtfood_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cached_network_image: ^3.4.1
  firebase_core: ^4.6.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  google_fonts: ^8.0.2
  provider: ^6.1.5+1
  cloudinary_url_gen: ^1.0.0
  http: ^1.3.0
  image_picker: ^1.1.2
  lottie: ^3.3.1
  shared_preferences: ^2.5.3
  showcaseview: ^5.0.2
  smooth_page_indicator: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env 
    - assets/json/ingredientes.json
    - assets/json/Preparing Food.json
    - assets/json/WTFood-animation.json
    - assets/images/
