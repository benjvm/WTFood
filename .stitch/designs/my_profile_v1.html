            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        }
        .neumorphic-inset {
            box-shadow: inset 6px 6px 12px #b0dab3, inset -6px -6px 12px #ffffff;
        }
        body {
            background-color: #deffe0; /* Explicit use of surface color */

<body class="font-body text-on-surface antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 z-40 bg-emerald-50/80 backdrop-blur-xl flex justify-between items-center px-6 h-16 w-full shadow-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container">
<img alt="user profile avatar" class="w-full h-full object-cover" data-alt="close-up portrait of a cheerful young woman with clear skin and natural makeup in soft sunlight" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBN-rYHe5dYxYGGY9atMLEgS1gk19AGGMC-pYhkTw5ZQmpaoV6bOIo5aOdIvgO438lvOzb8cPUkHCvcjRFmUrZWhuIL7j4EHoUDvpj9kwR2p-TIJXtE8JsSyv-vzFxnEtCMdPJovRlBEWKJDuPUge_IV5FdqoUQNlyvjEl7docxHBJ2yZuOzpVUBGZuZ3fwodZLpJS9-agEGrT3tltsY18ZTdllWVZpaHvI4jzy71gNYRxZ8O0GHETJvu6jN1uaT0atEU0jkUxACg" style="">
</div>
<span class="text-2xl font-black tracking-tighter text-lime-600 font-headline" style="">WTFood</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-lime-600 hover:bg-lime-100/50 transition-colors active:scale-95" style="">
<span class="material-symbols-outlined" data-icon="search" style="">search</span>
</button>
</header>
<main class="pt-24 pb-32 px-6 max-w-lg mx-auto">
<!-- Profile Header Section -->
<section class="flex flex-col items-center mb-12">
<div class="relative">
<div class="w-40 h-40 rounded-full neumorphic-lift bg-surface-container-lowest p-2 flex items-center justify-center overflow-hidden">
<img alt="Profile Picture" class="w-full h-full object-cover rounded-full" data-alt="high-quality studio portrait of a woman with a warm expression, soft natural lighting, and clean background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpaMLTbj7TUGpfgzGDy6iI_orsWl7RsMiyp_eYuyl9NuSt5Ym7_eoMx4vEHVxX2qPt6NaIc-hcNknTp8T1EsGmszVFzmNR_abUvyWXmFFMmAy8Pkq6_8GfbS1_ynGBC85CSn11INI9Gvvquf6aGGd98aR2jTnstyoMnlsPFx4Ts_mfXKMP1KFtJiCPTcc1F1tX9GFtCfIKcvGHTKTGrKmHZHZmM_NcvsP2tlMeGOM86pKHVTWElohpcEBisKC2urbcq3yManl1DQ" style="">
</div>
<button class="absolute bottom-1 right-1 bg-primary text-on-primary w-11 h-11 rounded-full flex items-center justify-center shadow-lg border-4 border-surface active:scale-90 transition-transform" style="">
<span class="material-symbols-outlined text-[20px]" data-icon="edit" style="">edit</span>
</button>
</div>
<h1 class="mt-6 font-headline text-3xl font-extrabold tracking-tight text-on-surface" style="">My Profile</h1>
<p class="text-on-surface-variant font-medium mt-1" style="">Manage your personal information</p>
</section>
<!-- Form Section -->
<section class="space-y-8">
<div class="space-y-6">
<!-- Full Name Field -->
<div class="flex flex-col gap-2">
<label class="text-[12px] font-bold uppercase tracking-widest text-on-surface-variant px-4 font-label" style="">Full Name</label>
<div class="neumorphic-inset bg-surface-container-high rounded-xl h-14 flex items-center px-6">
<input class="bg-transparent border-none w-full focus:ring-0 text-on-surface font-semibold text-lg" placeholder="Enter your name" type="text" value="Jane Doe">
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-[12px] font-bold uppercase tracking-widest text-on-surface-variant px-4 font-label" style="">Email</label>
<div class="neumorphic-inset bg-surface-container-high rounded-xl h-14 flex items-center px-6">
<input class="bg-transparent border-none w-full focus:ring-0 text-on-surface font-semibold text-lg" placeholder="Enter your email" type="email" value="jane.doe@example.com">
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-4 flex flex-col gap-4">
<button class="group flex items-center justify-between bg-surface-container-lowest h-16 px-6 rounded-xl shadow-sm hover:shadow-md transition-all active:scale-98" style="">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-tertiary/10 text-tertiary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="lock" style="">lock</span>
</div>
<span class="font-bold text-on-surface" style="">Change Password</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:translate-x-1 transition-transform" data-icon="chevron_right" style="">chevron_right</span>
</button>
<button class="group flex items-center justify-between bg-surface-container-lowest h-16 px-6 rounded-xl shadow-sm hover:shadow-md transition-all active:scale-98" style="">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary/10 text-primary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="notifications" style="">notifications</span>
</div>
<span class="font-bold text-on-surface" style="">Notification Settings</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:translate-x-1 transition-transform" data-icon="chevron_right" style="">chevron_right</span>
</button>
</div>
<!-- Primary Action -->
<div class="pt-6">
<button class="w-full h-16 rounded-full bg-gradient-to-br from-primary to-primary-dim text-on-primary font-headline font-bold text-lg shadow-xl shadow-primary/20 active:scale-[0.97] transition-all" style="">
                    Save Changes
                </button>
</div>
<!-- Logout -->
<button class="w-full py-4 text-error font-bold font-label text-sm uppercase tracking-widest opacity-80 hover:opacity-100 transition-opacity" style="">
                Sign Out
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-6 w-full z-50 flex justify-around items-center px-4 pointer-events-none">
<div class="bg-emerald-50/60 backdrop-blur-lg w-[92%] rounded-[3rem] border border-white/20 shadow-[0_20px_50px_rgba(14,54,27,0.1)] flex justify-around items-center h-20 px-2 pointer-events-auto">

<span class="material-symbols-outlined" data-icon="home" style="">home</span>
<span class="font-manrope text-[10px] font-bold uppercase tracking-widest mt-1" style="">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-emerald-900/70 p-2 hover:text-lime-600 transition-all active:scale-90 duration-200 ease-out" href="#" style="">
<span class="material-symbols-outlined" data-icon="kitchen" style="">kitchen</span>
<span class="font-manrope text-[10px] font-bold uppercase tracking-widest mt-1" style="">Fridge</span>
</a>
<a class="flex flex-col items-center justify-center text-emerald-900/70 p-2 hover:text-lime-600 transition-all active:scale-90 duration-200 ease-out" href="#" style="">
<span class="material-symbols-outlined" data-icon="center_focus_strong" style="">center_focus_strong</span>
<span class="font-manrope text-[10px] font-bold uppercase tracking-widest mt-1" style="">Scan</span>
</a>
<a class="flex flex-col items-center justify-center text-emerald-900/70 p-2 hover:text-lime-600 transition-all active:scale-90 duration-200 ease-out" href="#" style="">
<span class="material-symbols-outlined" data-icon="restaurant_menu" style="">restaurant_menu</span>
<span class="font-manrope text-[10px] font-bold uppercase tracking-widest mt-1" style="">Recipes</span>
</a>
<!-- ACTIVE: Profile -->
<a class="flex flex-col items-center justify-center bg-gradient-to-br from-lime-500 to-emerald-600 text-white rounded-full p-3 shadow-lg -translate-y-2 scale-110 active:scale-90 duration-200 ease-out" href="#" style="">
<span class="material-symbols-outlined" data-icon="person" style="">person</span>
<span class="font-manrope text-[10px] font-bold uppercase tracking-widest mt-1" style="">Profile</span>
</a>
</div>
</nav>
</body></html>
